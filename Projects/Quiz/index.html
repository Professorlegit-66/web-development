<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Form</title>
</head>
<body>
    <form method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="Enter Your Name" required="name" pattern=[Aa-Zz]></input><br>

        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Enter Your Email" required="password"></input><br>

        <label for="password">Password:</label>
        <input type="password" id="password" placeholder="Enter Your Password" required="password"></input><br>

        <label for="bday">Date of Birth:</label>
        <input type="date" id="bday" required></input><br>

        <label for="gender">Gender:</label><br>
        <input type="radio" value="F" name="gender" id="female">
        <label>Female</label> <br>
        <input type="radio" value="M" name="gender" id="male">
        <label>Male</label><br>

        <label>Upload Resume:</label>
        <input type="file" accept=".docx, .pdf, .txt"></input><br>

        <input type="reset"></input>
        <input type="submit"></input>
    </form>
</body>
</html>
