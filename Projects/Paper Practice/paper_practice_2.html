<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Form</title>
    <link rel="stylesheet" href="paper_practice_2_style.css">
</head>
<body>
    <header>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <form>
            <label>Name:</label>
            <input type="text" placeholder="Enter Your Name">

            <br>

            <label>Email:</label>
            <input type="email" placeholder="Enter Your Email">

            <br>

            <label>Gender:</label>
            <div class="gender">
                <input type="radio" name="gender" value="male">Male
                <input type="radio" name="gender" value="female">Female
            </div>
            
            <label>Country:</label>
            <select>
                <option>Pakistan</option>
                <option>India</option>
                <option>USA</option>
            </select>

            <button type="submit">Submit</button>

        </form>
    </main>

    <footer>
        <p>&copy; 2025 | KUST</p>
    </footer>
</body>
</html>
