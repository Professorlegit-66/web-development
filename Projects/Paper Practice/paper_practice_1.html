<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Stock Table</title>
</head>
<body>
    <table border="1" cellpadding="8" cellspacing="0">
        <tr>
            <th rowspan="2">Code</th>
            <th rowspan="2">Product</th>
            <th colspan="3">Stock in Stores</th>
        </tr>
        <tr>
            <th>Stock in Warehouses A</th>
            <th>Stock in Warehouses B</th>
            <th>Stock in Warehouses C</th>
        </tr>
        <tr>
            <td>101</td>
            <td>Laptop</td>
            <td>25</td>
            <td>18</td>
            <td>22</td>
        </tr>
        <tr>
            <td>102</td>
            <td>Keyboard</td>
            <td>40</td>
            <td>35</td>
            <td>30</td>
        </tr>
        <tr>
            <td colspan="2">Total</td>
            <td>65</td>
            <td>53</td>
            <td>52</td>
        </tr>
    </table>
    
    <br>

    <table border="1" cellpadding="5" cellspacing="0">
        <tr>
            <th>Roll No</th>
            <th>Name</th>
            <th>Database</th>
            <th>Machine Learning</th>
        </tr>
        <tr>
            <td>01</td>
            <td>Ali</td>
            <td>85</td>
            <td>56</td>
        </tr>
        <tr>
            <td>02</td>
            <td>Ahmad</td>
            <td>66</td>
            <td>86</td>
        </tr>
        <tr>
            <td colspan="2">Total Students</td>
            <td colspan="2">2</td>
        </tr>
    </table>
</body>
</html>
