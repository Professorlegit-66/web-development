<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        p {
            color: green;
        }

        div > p {
            color: orange;
        }

        div + p {
            color: yellow;
        }

    </style>

</head>
<body>

    <div>
        <p id="p1">Paragraph A</p>
        <p>Paragraph B</p>
        <section>
            <p>Paragraph C</p>
        </section>
    </div>

    <p>Paragraph D</p>

    <div class="box">
        <p>Paragraph <span>E</span></p>
        <div>
            Visit <a href="https://www.kust.edu.pk">KUST</a>
        </div>
    </div>

</body>
</html>
