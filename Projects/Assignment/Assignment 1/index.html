<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Google</title>
  <link style="border-radius: 50%; " rel="icon" type="image/x-icon" href="google-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Navigation -->
  <header>
    <nav>
      <a href="https://mail.google.com" target="_blank">Gmail</a>
      <a href="https://images.google.com" target="_blank">Images</a>
      <div class="profile-pic"></div>
    </nav>
  </header>

  <!-- Main Content -->
  <main>
    <h1 class="logo">Google</h1>
    
    <div class="search-container">
      <input type="text" placeholder="Search Google or type a URL">
    </div>

    <div class="buttons">
      <button>Google Search</button>
      <button>I'm Feeling Lucky</button>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="location">Pakistan</div>
    <div class="footer-links">
      <div class="left">
        <a href="https://about.google/?fg=1" target="_blank">About</a>
        <a href="https://business.google.com/en-all/google-ads/?subid=ww-ww-et-g-awa-a-g_hpafoot1_1!o2&fg=1" target="_blank">Advertising</a>
        <a href="https://www.google.com/intl/en_pk/business/" target="_blank">Business</a>
      </div>
      <div class="right">
        <a href="https://policies.google.com/privacy" target="_blank">Privacy</a>
        <a href="https://policies.google.com/terms" target="_blank">Terms</a>
        <a href="https://policies.google.com/settings" target="_blank">Settings</a>
      </div>
    </div>
  </footer>

</body>
</html>
